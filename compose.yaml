services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=security_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
    ports:
      - '5432:5432'

  # Local Git server to test the GitOps synchronization (silicaproxy.gitops.*) in development.
  # Provisioned automatically by the "gitea-init" service below (user, repository, token).
  gitea:
    image: 'gitea/gitea:1.26.4'
    environment:
      - 'GITEA__security__INSTALL_LOCK=true'
      - 'GITEA__database__DB_TYPE=sqlite3'
      - 'GITEA__server__ROOT_URL=http://localhost:3000/'
      - 'GITEA__service__DISABLE_REGISTRATION=true'
    ports:
      - '3000:3000'
    volumes:
      - 'gitea-data:/data'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/version']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the development Gitea user, "policies" repository and token automatically
  # (see dev/gitea-init.sh) as soon as "docker compose up" starts, with no manual step.
  gitea-init:
    image: 'alpine:3.20'
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      - 'GITEA_URL=http://gitea:3000'
      - 'PUBLIC_GITEA_URL=http://localhost:3000'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './dev:/scripts'
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'apk add --no-cache bash docker-cli curl git >/dev/null && bash /scripts/gitea-init.sh'

volumes:
  gitea-data:
