rules:
  # ===== Block list =====
  - package: "jeIlyfish"
    version: "*"
    action: "block"
    reason: "Typosquatting of the legitimate jellyfish package (lowercase l replaced by uppercase I)"

  - package: "python-dateutil"
    version: "1.0"
    action: "block"
    reason: "Trapped version trying to steal SSH credentials"

  - package: "colourama"
    version: "*"
    action: "block"
    reason: "Typosquatting of the legitimate colorama package"

  # ===== Allow list =====
  - package: "requests"
    version: "*"
    action: "allow"
    reason: "Approved standard Python HTTP client"

  - package: "flask"
    version: "3.*"
    action: "allow"
    reason: "Web framework approved for internal microservices"

  - package: "pydantic"
    version: "2.*"
    action: "allow"
    reason: "Approved validation library"
