rules:
  # ===== Block list =====
  - package: "event-stream"
    version: "3.3.6"
    action: "block"
    reason: "Compromised by an attacker (flatmap-stream incident, Nov 2018)"

  - package: "ua-parser-js"
    version: "0.7.29"
    action: "block"
    reason: "Compromised version shipping a cryptominer and a trojan"

  - package: "colors"
    version: "1.4.1"
    action: "block"
    reason: "Deliberately sabotaged by its maintainer (infinite loop)"

  - package: "faker"
    version: "6.6.6"
    action: "block"
    reason: "Deliberately sabotaged by its maintainer (malicious code)"

  - package: "node-ipc"
    version: "10.1.*"
    action: "block"
    reason: "Maintainer protestware - targeted destructive code (peacenotwar)"

  # ===== Allow list =====
  - package: "lodash"
    version: "*"
    action: "allow"
    reason: "Utility library approved by the architecture team"

  - package: "express"
    version: "4.*"
    action: "allow"
    reason: "Company standard web framework"

  - package: "axios"
    version: "*"
    action: "allow"
    reason: "Approved HTTP client"

  # ===== Temporary exception (expires) =====
  # Ignored from 1 January 2027 00:00 UTC, with no new commit.
  - package: "minimist"
    version: "1.2.5"
    action: "allow"
    reason: "Temporary exception while migrating to 1.2.8"
    expires: "2026-12-31"
